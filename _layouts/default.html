<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f5ed">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{% if page.title and page.title != '첫 화면' %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title | escape }} RSS" href="{{ '/feed.xml' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <div class="site-shell">
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="이삭 보관통 첫 화면">
        <span class="brand-mark" aria-hidden="true">✳</span>
        <span>이삭 보관통</span>
      </a>
      <nav class="main-nav" aria-label="주 메뉴">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>첫 화면</a>
        <a href="{{ '/archive/' | relative_url }}"{% if page.url == '/archive/' %} aria-current="page"{% endif %}>글 보관함</a>
        <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>소개</a>
      </nav>
      <button class="theme-toggle" type="button" title="밝기 전환" aria-label="어두운 화면으로 전환" aria-pressed="false">
        <span class="theme-symbol" aria-hidden="true">☾</span>
      </button>
    </header>
    <main id="main-content">{{ content }}</main>
    <footer class="site-footer">
      <div class="footer-top">
        <a class="footer-brand" href="{{ '/' | relative_url }}">✳ &nbsp; 이삭 보관통</a>
        <div class="footer-links"><a href="{{ '/archive/' | relative_url }}">글 보관함</a><a href="{{ '/about/' | relative_url }}">소개</a><a href="{{ '/feed.xml' | relative_url }}">RSS</a></div>
      </div>
      <div class="footer-bottom"><span>읽고, 생각하고, 적어 두는 곳.</span><span>© {{ 'now' | date: '%Y' }} 이삭 보관통</span></div>
    </footer>
  </div>
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
